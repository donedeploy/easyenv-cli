all:
  hosts:
    master:
      ansible_host: master
      ansible_user: easyenv
      ansible_python_interpreter: /usr/bin/python3
    worker-1:
      ansible_host: worker-1
      ansible_user: easyenv
      ansible_python_interpreter: /usr/bin/python3
    worker-2:
      ansible_host: worker-2
      ansible_user: easyenv
      ansible_python_interpreter: /usr/bin/python3
  children:
    kube_control_plane:
      hosts:
        master:
    kube_node:
      hosts:
        master:
        worker-1:
        worker-2:
    etcd:
      hosts:
        master:
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
    calico_rr:
      hosts: {}
