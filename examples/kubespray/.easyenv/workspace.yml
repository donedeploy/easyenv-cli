apiVersion: easyenv.io/v1
kind: Workspace
metadata:
  title: example-kubespray
  description: 3-node Kubernetes cluster (1 control plane + 2 workers) deployed via Kubespray.
spec:
  duration: 4
  duration_unit: hours
  cross_connection: true
  machines:
    - title: master
      recipe: Ubuntu 24.04 LTS
      resources:
        cpu: 4
        ram_mb: 4096
      stacks:
        - title: install-kubespray
          runner: bash
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq python3-venv git rsync sshpass make
            if [ ! -d /opt/kubespray ]; then
              git clone --depth 1 -b release-2.29 \
                https://github.com/kubernetes-sigs/kubespray.git /opt/kubespray
            fi
            python3 -m venv /opt/kubespray/.venv
            /opt/kubespray/.venv/bin/pip install --upgrade pip
            /opt/kubespray/.venv/bin/pip install -r /opt/kubespray/requirements.txt
            chown -R easyenv:easyenv /opt/kubespray

    - title: worker-1
      recipe: Ubuntu 24.04 LTS
      resources:
        cpu: 2
        ram_mb: 4096

    - title: worker-2
      recipe: Ubuntu 24.04 LTS
      resources:
        cpu: 2
        ram_mb: 4096
