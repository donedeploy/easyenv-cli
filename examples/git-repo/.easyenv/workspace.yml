apiVersion: easyenv.io/v1
kind: Workspace
metadata:
  title: example-git-repo
  description: Same Flask app as the `flask` example, but the box clones it from GitHub on boot.
spec:
  duration: 2
  duration_unit: hours
  machines:
    - title: app
      recipe: Python Dev Env
      resources:
        cpu: 2
        ram_mb: 2048
      git_repo: https://github.com/donedeploy/easyenv-cli
      ports:
        - "5000"
      stacks:
        - title: install-flask
          runner: bash
          script: |
            set -e
            pip install --break-system-packages flask
