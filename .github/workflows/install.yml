name: Install scripts

# Runs install.sh and install.ps1 from this checkout on every platform the
# one-liners promise:
#
#   curl -fsSL https://get.easyenv.io/cli | sh
#   irm https://get.easyenv.io/cli.ps1 | iex
#
# get.easyenv.io redirects to these two files on main, so a merge here changes
# what every new install runs. The `live` input runs the real one-liners
# against get.easyenv.io instead, to check the redirect end to end.

on:
  pull_request:
    paths: [install.sh, install.ps1, test/**, .github/workflows/install.yml]
  push:
    branches: [main]
    paths: [install.sh, install.ps1, test/**, .github/workflows/install.yml]
  workflow_dispatch:
    inputs:
      live:
        description: Also run the one-liners from https://get.easyenv.io
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh install.sh test/install_test.sh

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sh test/install_test.sh

  alpine:
    # busybox sh and busybox wget, no curl and no sudo.
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v4
      - run: sh test/install_test.sh

  windows:
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./test/install_test.ps1 -Shell ${{ matrix.shell }}

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os != 'Windows'
        run: |
          curl -fsSL https://get.easyenv.io/cli | sh
          easyenv --version
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://get.easyenv.io/cli.ps1 | iex
          easyenv --version
